name: Network contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r bot/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Require contract fixtures and documentation for wire changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/p2p/(protocol|signalling|webrtc)\.ts|bot/(protocol|peer)\.py|mycelium-peer/bot/(protocol|peer)\.py|server\.py)$'; then
            for required in docs/network-protocol.md tests/fixtures/network-contract.json; do
              if ! printf '%s\n' "$changed_files" | grep -Fxq "$required"; then
                echo "A networking contract source changed without updating $required." >&2
                exit 1
              fi
            done
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run TypeScript tests
        run: npm test
      - name: Build and type-check browser
        run: npm run build
      - name: Run Python bot and server tests
        run: python -m unittest bot.test_protocol_contract bot.test_peer server_test -q
      - name: Run browser to Python bot interoperability test
        run: npm run test:integration:network
